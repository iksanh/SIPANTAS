server {
    listen 80;
    server_name sipantas.example.go.id;
    # certbot akan menambahkan blok TLS dan pengalihan ke 443 di sini.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sipantas.example.go.id;

    # ssl_certificate & ssl_certificate_key diisi otomatis oleh certbot.

    # Harus sama dengan MAKS_UNGGAH di berkas/aplikasi.py (120 MB):
    # unggahan template .docx dan foto lapangan sekaligus.
    client_max_body_size 120M;

    access_log /var/log/nginx/sipantas-access.log;
    error_log  /var/log/nginx/sipantas-error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location /static/ {
        alias /srv/sipantas/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Konversi PDF lewat LibreOffice boleh sampai 180 detik (pdf.py).
        proxy_read_timeout 200s;
    }
}
